<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablero de Seguimiento CVProgreso · Mejora tu Casa</title>
<style>
:root{
  --red:#E3182F;--red-d:#B3141F;--navy:#0F172A;--navy2:#1E293B;
  --slate:#64748B;--slate2:#94A3B8;--line:#E2E8F0;--bg:#F1F5F9;--card:#fff;
  --amber:#F9B52D;--amber-d:#D97706;--teal:#17A98E;
  --ok:#16A34A;--warn:#F59E0B;--bad:#DC2626;
  --radius:16px;--shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px -12px rgba(15,23,42,.18);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--navy);font-family:"Segoe UI",Inter,system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
img{max-width:100%}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid rgba(227,24,47,.45);outline-offset:2px}

/* ---------- Encabezado ---------- */
.top{position:sticky;top:0;z-index:50;background:#fff;box-shadow:0 1px 0 var(--line)}
.top-inner{max-width:1760px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{height:58px;width:auto;display:block}
.titles{flex:1;min-width:220px}
.t1{font-size:17px;font-weight:700;letter-spacing:-.01em}
.t2{font-size:12px;color:var(--slate);margin-top:2px;display:flex;align-items:center;gap:6px}
.t2 i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;box-shadow:0 0 0 3px rgba(22,163,74,.18)}
.filters{display:flex;gap:10px;flex-wrap:wrap}
.fil{display:flex;flex-direction:column;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:5px 10px 6px;min-width:150px;transition:border-color .15s,box-shadow .15s}
.fil:hover,.fil:focus-within{border-color:var(--red);box-shadow:0 0 0 3px rgba(227,24,47,.10)}
.fil label{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--slate)}
.fil select{border:0;background:transparent;font-weight:600;font-size:13.5px;padding:0;cursor:pointer;appearance:none;-webkit-appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%23E3182F' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat:no-repeat;background-position:right 2px center;padding-right:20px}
.redline{height:3px;background:var(--red)}
.tabs{max-width:1760px;margin:0 auto;padding:8px 24px 10px;display:flex;gap:6px;overflow-x:auto}
.tab{border:0;background:transparent;border-radius:999px;padding:8px 16px;font-weight:600;color:var(--slate);cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
.tab:hover{background:var(--bg);color:var(--navy)}
.tab[aria-selected="true"]{background:var(--navy2);color:#fff;box-shadow:0 4px 12px -4px rgba(15,23,42,.45)}
.tab.sec{margin-left:auto}

/* ---------- Contenido ---------- */
main{max-width:1760px;margin:0 auto;padding:22px 24px 40px;min-height:60vh}
.banner{background:#FFF7ED;border:1px solid #FED7AA;color:#9A3412;border-radius:12px;padding:10px 14px;margin-bottom:18px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.banner b{font-weight:700}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px;border:1px solid rgba(226,232,240,.7)}
.card h3{margin:0 0 2px;font-size:15px;font-weight:700;letter-spacing:-.01em}
.card .sub{color:var(--slate);font-size:12.5px;margin-bottom:14px}
.card.hasdl{position:relative}.card.hasdl h3{padding-right:90px}
.dl{position:absolute;top:14px;right:16px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:10px;padding:6px 11px;font-weight:700;font-size:12px;font-family:inherit;cursor:pointer;transition:background .15s,border-color .15s}
.dl:hover{background:var(--bg);border-color:#CBD5E1}.dl svg{width:14px;height:14px}
@media print{.dl{display:none}}
.grid{display:grid;gap:18px}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.mt{margin-top:18px}
@media (max-width:1180px){.g5{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr}}
@media (max-width:720px){.g5,.g4,.g2{grid-template-columns:1fr}.top-inner{padding:10px 14px}main{padding:16px 14px 32px}.fil{min-width:130px}}

/* Portada */
.hero{position:relative;overflow:hidden;text-align:center;padding:42px 24px 34px;background:
  radial-gradient(900px 260px at 50% -40%,rgba(227,24,47,.10),transparent 70%),#fff}
.hero .eyebrow{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.12em;color:#000;background:var(--bg);border:1px solid var(--line);padding:6px 14px;border-radius:999px}
.hero h1{margin:18px 0 0;font-size:clamp(26px,4.2vw,40px);line-height:1.12;letter-spacing:-.02em;font-weight:800;color:var(--navy)}
.hero h1 em{display:block;font-style:normal;color:var(--red)}
.hero p{max-width:760px;margin:14px auto 0;color:#334155;font-size:15px}
.kpi{position:relative;padding:18px 20px 16px;overflow:hidden;transition:transform .18s,box-shadow .18s}
.kpi:hover{transform:translateY(-3px);box-shadow:0 14px 34px -14px rgba(15,23,42,.28)}
.kpi::before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:var(--c,var(--red))}
.kpi .lb{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--slate)}
.kpi .vl{font-size:40px;font-weight:800;letter-spacing:-.03em;margin:8px 0 2px;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1.05}
.kpi .vl.money{font-size:26px}
.kpi .nt{font-size:12px;color:var(--slate2);min-height:18px}
.kpi .bar{height:6px;background:var(--bg);border-radius:99px;overflow:hidden;margin-top:12px}
.kpi .bar i{display:block;height:100%;background:var(--c,var(--red));border-radius:99px;transform-origin:left;animation:grow .9s cubic-bezier(.2,.8,.2,1)}
.kpi .pc{font-size:11.5px;color:var(--slate);margin-top:6px}
.stack{display:flex;height:22px;border-radius:99px;overflow:hidden;background:var(--bg);margin:6px 0 12px}
.stack i{display:block;height:100%;transform-origin:left;animation:grow .9s cubic-bezier(.2,.8,.2,1)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:#334155}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend b{display:inline-block;width:11px;height:11px;border-radius:3px}
.legend s{display:inline-block;width:18px;height:0;border-top:2px dashed var(--slate2)}

/* Barras */
.bars{display:flex;flex-direction:column;gap:9px}
.brow{display:grid;grid-template-columns:minmax(120px,300px) 1fr 100px;gap:12px;align-items:center;cursor:default}
.blabel{font-size:13px;color:#334155;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btrack{height:20px;background:var(--bg);border-radius:8px;overflow:hidden}
.bfill{height:100%;border-radius:8px;transform-origin:left;animation:grow .8s cubic-bezier(.2,.8,.2,1);transition:filter .15s}
.brow:hover .bfill{filter:brightness(.92)}
.bval{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.bval span{font-weight:500;color:var(--slate);font-size:11.5px;margin-left:6px}
@media (max-width:720px){.brow{grid-template-columns:1fr 70px}.btrack{grid-column:1/-1;order:3}}
@keyframes grow{from{transform:scaleX(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Alertas */
.alert{display:flex;align-items:center;gap:12px;border-radius:12px;padding:12px 14px;margin-top:12px;background:var(--bg);border:1px solid var(--line)}
.alert .dot{width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 22%,transparent);flex:none}
.alert .tx{flex:1;font-size:12.5px;color:var(--slate)}
.alert .tx b{display:block;color:var(--navy);font-size:13.5px}
.pill{font-size:12px;font-weight:700;color:#fff;background:var(--c);border-radius:99px;padding:4px 11px;white-space:nowrap}
.warnbox{background:#FFFBEB;border:1px solid #FDE68A;color:#B45309;border-radius:12px;padding:11px 14px;font-size:13px;margin-top:18px}

/* Gráfica de líneas */
.chart{width:100%;position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--slate);font-size:11px}
.chart .ln{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.chart .pt{stroke:#fff;stroke-width:2}
.empty{display:flex;align-items:center;justify-content:center;color:var(--slate2);min-height:140px;font-size:13px}

/* Tablas */
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;max-height:620px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--navy2);color:#fff;text-align:left;padding:11px 14px;font-weight:600;white-space:nowrap;cursor:pointer;user-select:none;z-index:1}
th:first-child{border-top-left-radius:11px}th:last-child{border-top-right-radius:11px}
th .ar{opacity:.55;margin-left:4px;font-size:10px}
th.nr,td.nr{text-align:right;font-variant-numeric:tabular-nums}
td{padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:nth-child(even) td{background:#F8FAFC}
tbody tr:hover td{background:#FEF2F2}
tfoot td{font-weight:800;background:var(--bg)!important;border-top:2px solid var(--navy2)}
.chip{display:inline-flex;align-items:center;gap:7px}
.chip i{width:9px;height:9px;border-radius:50%}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.search input{border:0;background:transparent;flex:1;outline:none}
.btn{border:0;border-radius:12px;padding:9px 16px;font-weight:700;cursor:pointer;background:var(--red);color:#fff;transition:background .15s,transform .1s}
.btn:hover{background:var(--red-d)}.btn:active{transform:translateY(1px)}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}.btn.ghost:hover{background:var(--bg)}
.btn[disabled]{opacity:.4;cursor:default}
.pager{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:12px;color:var(--slate);font-size:13px}


.tip{position:fixed;display:none;z-index:99;pointer-events:none;background:var(--navy);color:#fff;font-size:12.5px;line-height:1.5;padding:9px 12px;border-radius:10px;box-shadow:0 12px 30px -8px rgba(15,23,42,.5);max-width:300px}
.tip b{color:#fff}.tip .d{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.loading{padding:80px 0;text-align:center;color:var(--slate)}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
.pdf{margin-left:auto;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.pdf svg{width:16px;height:16px}
.printhead{display:none}
@media print{
  @page{size:A4 landscape;margin:8mm}
  html,body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff;font-size:12px}
  .top{position:static;box-shadow:none}
  .top-inner{padding:4px 0}.brand{height:46px}
  .tabs,.filters,.pdf,.dl,.toolbar,.pager{display:none!important}
  main{padding:8px 0 0;max-width:none;min-height:0}
  .printhead{display:block;margin:0 0 12px;padding:8px 12px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--red);border-radius:10px;font-size:12px;color:var(--navy)}
  .card{box-shadow:none;break-inside:avoid;page-break-inside:avoid}
  .g5{grid-template-columns:repeat(5,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
  *{animation:none!important;transition:none!important}
}
</style>
<!-- Opcional por ambiente: config.js junto a este archivo con  window.CVP_CONFIG = { apiBase: '/api/tablero' };  -->
<script src="config.js"></script>
<script>
/* ===== CONFIGURACIÓN (desarrollo) =====
   apiBase: ruta base del servicio que devuelve JSON. Si queda vacío, el tablero usa
   window.CVP_DATA (si existe) o, en último caso, datos de EJEMPLO.
   Endpoints esperados (ver README): {apiBase}/hogares /historial /lotes /pagos /parametros */
window.CVP_CONFIG = Object.assign({ apiBase: '' }, window.CVP_CONFIG || {});
</script>
</head>

<script>
(function(){
'use strict';

/* =====================================================================
   UTILIDADES
   ===================================================================== */
const $ = (s,r=document)=>r.querySelector(s);
const nf = new Intl.NumberFormat('es-CO');
const fInt = v=>nf.format(Math.round(v||0));
const fMoney = v=>(v<0?'-':'')+'$'+nf.format(Math.abs(Math.round(v||0)));
const fMoneyM = v=>(v<0?'-':'')+'$'+nf.format(Math.round(Math.abs(v||0)/1e6))+' M';
const fPct = v=>isFinite(v)?(v*100).toLocaleString('es-CO',{minimumFractionDigits:1,maximumFractionDigits:1})+'%':'—';
const esc = s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ts = x=>{ if(x==null||x==='')return null; const t=new Date(x).getTime(); return isNaN(t)?null:t; };
const pad = n=>String(n).padStart(2,'0');
const fDate = t=>{ if(t==null)return '—'; const d=new Date(t); return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear(); };
const fStamp = t=>{ const d=new Date(t); let h=d.getHours(); const ap=h>=12?'PM':'AM'; h=h%12||12;
  return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+' '+pad(h)+':'+pad(d.getMinutes())+' '+ap; };
const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

/* Colores por estado (misma regla que la medida "Color Estado Pipeline") */
function stateColor(n){
  if(!n) return '#CBD5E1';
  const s=n.toLowerCase();
  if(s.includes('diagnóstico')) return '#FCA5A5';
  if(s.includes('estructuración') && s.includes('aprobada')) return '#DC2626';
  if(s.includes('estructuración')) return '#F87171';
  if(s.includes('asignad')) return '#B91C1C';
  if(s.includes('ejecuci')) return '#991B1B';
  if(s.includes('ejecutado')||s.includes('entregado')||s.includes('verificado')) return '#7F1D1D';
  return '#94A3B8';
}
const PIPE = ['Diagnóstico en proceso','Diagnóstico revisión interventoría','Diagnóstico no viable','Diagnóstico viable',
  'Estructuración en proceso','Estructuración por subsanar','Estructuración aprobada','Asignado','En ejecución','Ejecutado',
  'Ejecutado Entregado','Pendiente por subsanar (ejecutado entregado)','Subsanado (ejecutado entregado)',
  'Entregado aprobado','Entregado no aprobado','Ejecutado con certificado de existencia'];
const ASG = new Set(['Asignado','En ejecución','Ejecutado']);

/* =====================================================================
   DATOS: API  →  window.CVP_DATA  →  ejemplo
   ===================================================================== */
async function loadData(){
  const cfg = window.CVP_CONFIG||{};
  if(cfg.apiBase){
    const get = async p=>{ const r=await fetch(cfg.apiBase.replace(/\/$/,'')+'/'+p,{credentials:'same-origin'}); if(!r.ok) throw new Error(p+' '+r.status); return r.json(); };
    const [hogares,historial,lotes,pagos,parametros] = await Promise.all(['hogares','historial','lotes','pagos','parametros'].map(get));
    return {raw:{hogares,historial,lotes,pagos,parametros:Array.isArray(parametros)?parametros[0]:parametros}, sample:false};
  }
  if(window.CVP_DATA) return {raw:window.CVP_DATA, sample:false};
  if(cfg.allowSample !== true) throw new Error("Datos no disponibles. Contacte al administrador del tablero.");
  return {raw:sampleData(), sample:true};
}

/* Datos de EJEMPLO (solo para visualizar el diseño; no son cifras reales) */
function sampleData(){
  let a=20261005; const rnd=()=>{ a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296; };
  const pick=arr=>arr[Math.floor(rnd()*arr.length)];
  const DAY=86400000, NOW=Date.now();
  const lotes=[
    {LoteID:2844,NombreLote:'Bosa Lote 1',NumContrato:'1-2026',Contratista:'CONSORCIO MEJOR BOSA',n:268,barrios:['EL JARDÍN','SAN BERNARDINO','BRASIL','LA ESTACIÓN']},
    {LoteID:2846,NombreLote:'Bosa Lote 2',NumContrato:'2-2026',Contratista:'CONSORCIO MEJOR BOSA',n:296,barrios:['EL JARDÍN','LA PAZ','PROVIDENCIA','SANTA FE']},
    {LoteID:2847,NombreLote:'Suba Lote 1',NumContrato:'3-2026',Contratista:'VANUR S.A.S.',n:289,barrios:['BILBAO PRIMER SECTOR','BILBAO SEGUNDO SECTOR','LISBOA','TIBABUYES']},
    {LoteID:2848,NombreLote:'Suba Lote 2',NumContrato:'4-2026',Contratista:'Fundación Forjando Futuros F F',n:298,barrios:['LISBOA','SAN CARLOS','EL RINCÓN','GAITANA']}
  ];
  const PATH=[['Diagnóstico en proceso',8],['Diagnóstico revisión interventoría',9],['Diagnóstico viable',13],['Estructuración en proceso',12],
    ['Estructuración aprobada',14],['Asignado',15],['En ejecución',1],['Ejecutado Entregado',2],['Ejecutado con certificado de existencia',19]];
  const CONT=[.97,.93,.9,.86,.72,.38,.42,.22];
  const L='ABCDEFGHJKLMNPRSTUVXYZ'; const hog=[],hist=[]; let hid=14000,hh=1;
  const lotesOut=lotes.map(l=>({LoteID:l.LoteID,NombreLote:l.NombreLote,NumContrato:l.NumContrato,Contratista:l.Contratista,MetaHogares:220,ValorTotalContrato:0}));
  lotes.forEach((l,li)=>{
    let sum=0;
    for(let i=0;i<l.n;i++){
      hid++; const v=Math.round((28+rnd()*27)*1e6/1000)*1000; sum+=v;
      let t=new Date('2026-06-01').getTime()+rnd()*80*DAY, k=0; const dates=[t];
      while(k<PATH.length-1 && rnd()<CONT[k]){ t+= (4+rnd()*20)*DAY; if(t>NOW) break; k++; dates.push(t); }
      for(let j=0;j<=k;j++) hist.push({HistorialID:hh++,HogarID:hid,EstadoID:PATH[j][1],EstadoNombre:PATH[j][0],FechaCambio:new Date(dates[j]).toISOString()});
      const st=PATH[k][0]; let ve=0;
      if(st==='En ejecución') ve=v*(.1+rnd()*.6); else if(k>=7) ve=v*(.95+rnd()*.05);
      hog.push({HogarID:hid,CHIP:'AAA0'+Math.floor(100+rnd()*99)+L[Math.floor(rnd()*L.length)]+L[Math.floor(rnd()*L.length)]+L[Math.floor(rnd()*L.length)]+L[Math.floor(rnd()*L.length)],
        LoteID:l.LoteID,EstadoActualID:PATH[k][1],EstadoActual:st,Terminado:k>=7?1:0,ValorViviendaContrato:v,ValorEjecutadoObra:Math.round(ve),
        Barrio:pick(l.barrios),FechaInicioObra:k>=6?new Date(dates[6]).toISOString():null,FechaFinObra:k>=6?new Date(dates[6]+90*DAY).toISOString():null});
    }
    lotesOut[li].ValorTotalContrato=Math.round(sum*1.12/1e6)*1e6;
  });
  const pagos=[]; for(let i=0;i<6;i++) pagos.push({PagoID:i+1,Fecha:new Date(NOW-(i*9+3)*DAY).toISOString(),Valor:Math.round((150+rnd()*250))*1e6,LoteID:2844});
  return {hogares:hog,historial:hist,lotes:lotesOut,pagos:pagos,
    parametros:{FechaInicioProyecto:'2026-06-01',FechaFinProyecto:'2026-12-31',FechaActualizacion:new Date().toISOString()}};
}

/* Preparación (equivalente al modelo semántico de Power BI) */
let D=null;
// El catálogo local antepone un ordinal a algunos nombres (p. ej. "7. Estructuración aprobada").
// Se normaliza solo para comparar etapas; los ids y el archivo fuente permanecen intactos.
const normalizeState = value => String(value || '').replace(/^\s*\d+\.\s*/, '').trim();
function prep(raw){
  const lm=new Map();
  (raw.lotes||[]).forEach(r=>{
    const id=+r.LoteID;
    if(!lm.has(id)) lm.set(id,{LoteID:id,NombreLote:r.NombreLote,NumContrato:r.NumContrato,ValorTotalContrato:+r.ValorTotalContrato||0,MetaHogares:+r.MetaHogares||0,Contratista:r.Contratista||''});
    else{ const l=lm.get(id); if(r.Contratista && !l.Contratista.includes(r.Contratista)) l.Contratista=l.Contratista?l.Contratista+' / '+r.Contratista:r.Contratista; }
  });
  const lotes=[...lm.values()].sort((x,y)=>x.LoteID-y.LoteID);
  const loteById=new Map(lotes.map(l=>[l.LoteID,l]));
  const hog=(raw.hogares||[]).map(h=>({HogarID:+h.HogarID,CHIP:h.CHIP||'',LoteID:+h.LoteID,Estado:normalizeState(h.EstadoActual),EstadoID:h.EstadoActualID,
    Terminado:+h.Terminado?1:0,v:+h.ValorViviendaContrato||0,ve:+h.ValorEjecutadoObra||0,Barrio:h.Barrio||'',ini:ts(h.FechaInicioObra),fin:ts(h.FechaFinObra)}));
  const hById=new Map(hog.map(h=>[h.HogarID,h]));
  const reach=new Map(), assigned=new Map();
  (raw.historial||[]).forEach(r=>{
    const hid=+r.HogarID,t=ts(r.FechaCambio),n=normalizeState(r.EstadoNombre); if(t==null||!n) return;
    let m=reach.get(n); if(!m){m=new Map();reach.set(n,m);} if(!m.has(hid)||t<m.get(hid)) m.set(hid,t);
    if(ASG.has(n) && (!assigned.has(hid)||t<assigned.get(hid))) assigned.set(hid,t);
  });
  const pagos=(raw.pagos||[]).map(p=>({t:ts(p.Fecha),v:+p.Valor||0,LoteID:+p.LoteID})).filter(p=>p.t!=null);
  const par=raw.parametros||{};
  const ini=ts(par.FechaInicioProyecto)??new Date('2026-06-01').getTime();
  const fin=ts(par.FechaFinProyecto)??new Date('2026-12-31').getTime();
  const months=[]; const di=new Date(ini), df=new Date(fin);
  for(let y=di.getFullYear(),m=di.getMonth(); y<df.getFullYear()||(y===df.getFullYear()&&m<=df.getMonth()); m++){
    if(m>11){m=0;y++;} if(y>df.getFullYear()||(y===df.getFullYear()&&m>df.getMonth())) break;
    months.push({y,m,label:MES[m]+' '+y,q:'T'+(Math.floor(m/3)+1)+' '+y,end:new Date(y,m+1,0,23,59,59,999).getTime()});
  }
  return {lotes,loteById,hog,hById,reach,assigned,pagos,months,ini,fin,upd:ts(par.FechaActualizacion)??Date.now()};
}

/* =====================================================================
   ESTADO Y CONTEXTO (filtros)
   ===================================================================== */
const S={page:'portada',lote:'',anio:'',trim:'',q:'',sk:'CHIP',sd:1,pg:0};
function ctx(){
  const lotes=D.lotes.filter(l=>!S.lote||String(l.LoteID)===S.lote);
  const ids=new Set(lotes.map(l=>l.LoteID));
  const hog=D.hog.filter(h=>ids.has(h.LoteID));
  const hset=new Set(hog.map(h=>h.HogarID));
  const meta=lotes.reduce((a,l)=>a+l.MetaHogares,0);
  const months=D.months.filter(m=>(!S.anio||String(m.y)===S.anio)&&(!S.trim||m.q===S.trim));
  const cut=months.length?months[months.length-1].end:D.fin;
  return {lotes,ids,hog,hset,meta,months,cut};
}
const cntState=(c,n)=>c.hog.reduce((a,h)=>a+(h.Estado===n?1:0),0);
function cntReach(c,n,cut){ const m=D.reach.get(n); if(!m) return 0; let k=0; m.forEach((t,h)=>{ if(c.hset.has(h)&&t<=cut) k++; }); return k; }
function valAssigned(c,cut){ let s=0; D.assigned.forEach((t,h)=>{ if(c.hset.has(h)&&t<=cut){ const x=D.hById.get(h); if(x) s+=x.v; } }); return s; }
function sumPagos(c,cut){ return D.pagos.reduce((a,p)=>a+(c.ids.has(p.LoteID)&&p.t<=cut?p.v:0),0); }
// Misma base del dashboard de inicio: suma de numvalejecobra, sin filtro por estado.
const valEjecutado=c=>c.hog.reduce((a,h)=>a+h.ve,0);
function mesesRestantes(){ const n=new Date(), f=new Date(D.fin); return (f.getFullYear()-n.getFullYear())*12+(f.getMonth()-n.getMonth()); }
function alerta(acum,meta){
  const mr=mesesRestantes();
  if(acum>=meta) return {t:'En tiempo',c:'#16A34A'};
  if(mr<=0) return {t:'Atrasado',c:'#DC2626'};
  if(mr<=3) return {t:'En riesgo',c:'#F59E0B'};
  return {t:'En tiempo',c:'#16A34A'};
}

const tip=document.createElement('div'); tip.className='tip'; document.body.appendChild(tip);
function showTip(html,x,y){ tip.innerHTML=html; tip.style.display='block'; const r=tip.getBoundingClientRect();
  let l=x+14,t=y+14; if(l+r.width>innerWidth-8) l=x-r.width-14; if(t+r.height>innerHeight-8) t=y-r.height-14; tip.style.left=Math.max(8,l)+'px'; tip.style.top=Math.max(8,t)+'px'; }
function hideTip(){ tip.style.display='none'; }
document.addEventListener('mousemove',e=>{ const el=e.target.closest&&e.target.closest('[data-tip]'); if(el) showTip(el.getAttribute('data-tip').replace(/\n/g,'<br>'),e.clientX,e.clientY); else if(!e.target.closest('.chart')) hideTip(); });

function kpi(o){
  return `<div class="card kpi fade" style="--c:${o.c||'var(--red)'}"><div class="lb">${esc(o.lb)}</div>
    <div class="vl ${o.money?'money':''}">${o.money?fMoney(o.v):fInt(o.v)}</div>
    <div class="nt">${esc(o.nt||'')}</div>
    ${o.pct!=null?`<div class="bar"><i style="width:${Math.min(100,o.pct*100).toFixed(1)}%"></i></div><div class="pc">${esc(o.pcl||'')}</div>`:''}
  </div>`;
}
/* Descarga de datos por gráfica (CSV con ';' y BOM, se abre directo en Excel) */
const DL={};
const slug=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9]+/g,'_').replace(/^_+|_+$/g,'');
const dlBtn=(id,name,head,rows)=>{ DL[id]={name,head,rows};
  return `<button class="dl" type="button" data-dl="${id}" title="Descargar los datos de esta gráfica (CSV para Excel)" aria-label="Descargar datos: ${esc(name)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-5-5m5 5l5-5M4 21h16"/></svg>CSV</button>`; };
function downloadCsv(id){
  const d=DL[id]; if(!d) return;
  const q2=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const lines=[d.head.map(q2).join(';')].concat(d.rows.map(r=>r.map(q2).join(';')));
  const lote=S.lote?(D.loteById.get(+S.lote)||{}).NombreLote:'';
  const nombre='CVProgreso_'+slug(d.name)+(lote?'_'+slug(lote):'')+'_'+new Date().toISOString().slice(0,10)+'.csv';
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}));
  a.download=nombre; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}
document.addEventListener('click',e=>{ const b=e.target.closest&&e.target.closest('.dl'); if(b) downloadCsv(b.dataset.dl); });

function bars(items){
  const mx=Math.max(...items.map(i=>i.value),1);
  return `<div class="bars">`+items.map(i=>`<div class="brow" data-tip="${esc(i.tip||i.label+'\n'+fInt(i.value))}">
    <div class="blabel">${esc(i.label)}</div>
    <div class="btrack"><div class="bfill" style="width:${(i.value/mx*100).toFixed(2)}%;background:${i.color}"></div></div>
    <div class="bval">${fInt(i.value)}${i.sub?`<span>${esc(i.sub)}</span>`:''}</div></div>`).join('')+`</div>`;
}
function niceMax(v){ if(v<=0) return 1; const p=Math.pow(10,Math.floor(Math.log10(v))), f=v/p; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p; }

/* Gráfica de líneas (SVG, responsive, con tooltip por mes) */
function lineChart(el,cfg){
  if(!cfg.labels.length){ el.innerHTML='<div class="empty">Sin datos para el periodo seleccionado</div>'; return; }
  const W=Math.max(el.clientWidth,280),H=cfg.h||250,m={l:cfg.ml||54,r:18,t:14,b:30},iw=W-m.l-m.r,ih=H-m.t-m.b,n=cfg.labels.length;
  const vals=cfg.series.flatMap(s=>s.values).concat(cfg.meta!=null?[cfg.meta]:[]);
  let mx=niceMax(Math.max(...vals,1)), mn=Math.min(0,...vals); if(mn<0) mn=-niceMax(-mn);
  const X=i=>n===1?m.l+iw/2:m.l+iw*i/(n-1), Y=v=>m.t+ih*(1-(v-mn)/(mx-mn||1));
  const fy=cfg.fmt||fInt; let g='';
  for(let k=0;k<=4;k++){ const v=mn+(mx-mn)*k/4,y=Y(v); g+=`<line class="gl" x1="${m.l}" x2="${W-m.r}" y1="${y}" y2="${y}"/><text class="ax" x="${m.l-8}" y="${y+4}" text-anchor="end">${fy(v)}</text>`; }
  if(mn<0) g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(0)}" y2="${Y(0)}" stroke="#94A3B8" stroke-width="1.2"/>`;
  const every=Math.ceil(n/Math.max(1,Math.floor(iw/62)));
  cfg.labels.forEach((l,i)=>{ if(i%every===0||i===n-1) g+=`<text class="ax" x="${X(i)}" y="${H-8}" text-anchor="middle">${esc(l)}</text>`; });
  if(cfg.meta!=null) g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(cfg.meta)}" y2="${Y(cfg.meta)}" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="6 5"/><text class="ax" x="${W-m.r}" y="${Y(cfg.meta)-6}" text-anchor="end" style="font-weight:700">Meta ${fInt(cfg.meta)}</text>`;
  const id='g'+Math.random().toString(36).slice(2,7);
  let defs='',paths='';
  cfg.series.forEach((s,si)=>{
    const pts=s.values.map((v,i)=>[X(i),Y(v)]);
    const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    if(cfg.area){ defs+=`<linearGradient id="${id}${si}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.color}" stop-opacity=".28"/><stop offset="1" stop-color="${s.color}" stop-opacity="0"/></linearGradient>`;
      if(n>1) paths+=`<path d="${d} L${pts[n-1][0]} ${Y(Math.max(mn,0))} L${pts[0][0]} ${Y(Math.max(mn,0))} Z" fill="url(#${id}${si})"/>`; }
    paths+=`<path class="ln" d="${d}" stroke="${s.color}" ${s.dash?'stroke-dasharray="7 5"':''}/>`;
    paths+=pts.map(p=>`<circle class="pt" cx="${p[0]}" cy="${p[1]}" r="4" fill="${s.color}"/>`).join('');
  });
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(cfg.aria||'Gráfica de líneas')}"><defs>${defs}</defs>${g}${paths}
    <line id="${id}v" y1="${m.t}" y2="${H-m.b}" stroke="#94A3B8" stroke-dasharray="3 3" style="display:none"/>
    <rect x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent" id="${id}o"/></svg>`;
  const ov=el.querySelector('#'+id+'o'), vl=el.querySelector('#'+id+'v');
  ov.addEventListener('mousemove',e=>{
    const r=ov.getBoundingClientRect(), px=(e.clientX-r.left)/r.width*iw;
    const i=n===1?0:Math.max(0,Math.min(n-1,Math.round(px/iw*(n-1))));
    vl.setAttribute('x1',X(i)); vl.setAttribute('x2',X(i)); vl.style.display='';
    showTip(`<b>${esc(cfg.labels[i])}</b><br>`+cfg.series.map(s=>`<span class="d" style="background:${s.color}"></span>${esc(s.name)}: <b>${fy(s.values[i])}</b>`).join('<br>')+(cfg.meta!=null?`<br><span class="d" style="background:#94A3B8"></span>Meta: <b>${fInt(cfg.meta)}</b>`:''),e.clientX,e.clientY);
  });
  ov.addEventListener('mouseleave',()=>{ vl.style.display='none'; hideTip(); });
}

const PAGES=[

  return `

    ${kpi({lb:'En ejecución',v:ejec,nt:ejec?'':NOTE,c:'#991B1B',pct:ejec/m,pcl:fPct(ejec/m)+' de la meta'})}
    ${kpi({lb:'Mejoramientos terminados',v:term,nt:term?'':NOTE,c:'#7F1D1D',pct:term/m,pcl:fPct(term/m)+' de la meta'})}
    ${kpi({lb:'Con certificado de existencia',v:cert,nt:cert?'':NOTE,c:'#0F172A',pct:cert/m,pcl:fPct(cert/m)+' de la meta'})}
  </section>
  <section class="card hasdl mt fade">${dlBtn('avance','Avance del programa frente a la meta',['Etapa','Hogares','% de la meta'],seg.map(s=>[s[0],s[1],fPct(s[1]/m)]))}
    <h3>Avance del programa frente a la meta</h3>
    <div class="sub">Meta: ${fInt(m)} hogares${S.lote?'':' (4 lotes × 220)'} · ${fInt(used)} hogares en las etapas de estructuración aprobada en adelante</div>
    <div class="stack">${seg.map(s=>s[1]?`<i style="width:${(s[1]/m*100).toFixed(2)}%;background:${s[2]}" data-tip="${esc(s[0]+'\n'+fInt(s[1])+' hogares')}"></i>`:'').join('')}</div>

  </section>`;

function pageGeneral(c){
  const counts=new Map(); c.hog.forEach(h=>counts.set(h.Estado||'(Sin estado)',(counts.get(h.Estado||'(Sin estado)')||0)+1));
  const total=c.hog.length||1;
  const rank=n=>{ const i=PIPE.indexOf(n); return i<0?99:i; };
  const items=[...counts.entries()].sort((a,b)=>rank(a[0])-rank(b[0])||b[1]-a[1]).map(([n,v])=>({label:n,value:v,color:stateColor(n),sub:fPct(v/total),tip:n+'\n'+fInt(v)+' hogares · '+fPct(v/total)}));
  const phase=(k,title,name,color)=>{
    const acum=cntReach(c,name,c.cut), al=alerta(acum,c.meta);
    return `<div class="card hasdl fade">${dlBtn('fase'+k,title,['Mes','Hogares acumulados','Meta'],c.months.map(m=>[m.label,cntReach(c,name,m.end),c.meta]))}<h3>${title}</h3><div class="sub">Hogares que alcanzaron «${esc(name)}» (acumulado mensual)</div>
      <div class="chart" id="ch${k}"></div>
      <div class="alert" style="--c:${al.c}"><span class="dot"></span><div class="tx"><b>Alerta Fase ${k}</b>${fInt(acum)} de ${fInt(c.meta)} hogares (${fPct(acum/(c.meta||1))})</div><span class="pill">${al.t}</span></div></div>`;
  };
  [[1,'Estructuración aprobada','#E3182F'],[2,'Asignado','#F9B52D'],[3,'Ejecutado Entregado','#1E293B']].forEach(([k,name,color])=>{
    charts.push(()=>lineChart($('#ch'+k),{labels:c.months.map(m=>m.label),series:[{name:'Acumulado',color,values:c.months.map(m=>cntReach(c,name,m.end))}],meta:c.meta,area:true,aria:'Acumulado fase '+k}));
  });
  return `
  <section class="card hasdl fade">${dlBtn('estados','Hogares por estado actual',['Estado','Cantidad','Porcentaje'],items.map(i=>[i.label,i.value,i.sub]))}<h3>Hogares por estado actual</h3><div class="sub">Pasa el cursor sobre cada barra para ver el porcentaje · color más oscuro = etapa más avanzada</div>
    ${items.length?bars(items):'<div class="empty">Sin hogares para el filtro seleccionado</div>'}</section>
  <section class="grid g3 mt">
    ${phase(1,'Fase 1 · Estructuraciones aprobadas','Estructuración aprobada')}
    ${phase(2,'Fase 2 · Asignaciones','Asignado')}
    ${phase(3,'Fase 3 · Viviendas terminadas','Ejecutado Entregado')}
  </section>`;
}

function pagePresupuesto(c){
  const total=c.lotes.reduce((a,l)=>a+l.ValorTotalContrato,0), ejec=valEjecutado(c);
  const neta=valAssigned(c,c.cut)-sumPagos(c,c.cut);
  const sinPagos=!D.pagos.some(p=>c.ids.has(p.LoteID));
  charts.push(()=>lineChart($('#chP'),{labels:c.months.map(m=>m.label),h:300,ml:78,fmt:fMoneyM,aria:'Ejecución presupuestal',series:[
      {name:'Valor asignado acumulado',color:'#1E293B',values:c.months.map(m=>valAssigned(c,m.end))},
      {name:'Pagos registrados acumulados',color:'#D97706',values:c.months.map(m=>sumPagos(c,m.end))},
      {name:'Ejecución presupuestal neta',color:'#DC2626',dash:true,values:c.months.map(m=>valAssigned(c,m.end)-sumPagos(c,m.end))}]}));
  return `
  <section class="grid g4">
    ${kpi({lb:'Valor total contrato',v:total,money:1,c:'#1E293B',nt:S.lote?c.lotes[0]?.NombreLote||'':'4 lotes'})}
    ${kpi({lb:'Valor ejecutado',v:ejec,money:1,c:'#E3182F',nt:'Valor ejecutado registrado de las viviendas filtradas'})}
    <div class="card kpi fade" style="--c:#D97706"><div class="lb">% Ejecución presupuestal</div><div class="vl">${fPct(total?ejec/total:NaN)}</div><div class="nt">Valor ejecutado / valor total del contrato</div><div class="bar"><i style="width:${Math.min(100,total?ejec/total*100:0).toFixed(1)}%"></i></div></div>
    ${kpi({lb:'Ejecución presupuestal neta',v:neta,money:1,c:'#DC2626',nt:'Asignado acumulado − pagos registrados'})}
  </section>
  ${sinPagos?'<div class="warnbox">⚠ El módulo financiero aún no tiene pagos/desembolsos registrados para este programa. Este valor se actualizará automáticamente cuando el sistema los cargue.</div>':''}
  <section class="card hasdl mt fade">${dlBtn('pres','Evolución de la ejecución presupuestal',['Mes','Valor asignado acumulado','Pagos registrados acumulados','Ejecución presupuestal neta'],c.months.map(m=>{const a=valAssigned(c,m.end),p=sumPagos(c,m.end);return [m.label,Math.round(a),Math.round(p),Math.round(a-p)];}))}<h3>Evolución de la ejecución presupuestal</h3><div class="sub">Cifras en millones de pesos (M) · acumulado mensual</div>
    <div class="legend" style="margin-bottom:6px"><span><b style="background:#1E293B"></b>Valor asignado acumulado</span><span><b style="background:#D97706"></b>Pagos registrados acumulados</span><span><b style="background:#DC2626"></b>Ejecución presupuestal neta</span></div>
    <div class="chart" id="chP"></div></section>`;
}

function pageDetalle(c){
  const rows=c.lotes.map(l=>({l,n:c.hog.filter(h=>h.LoteID===l.LoteID).length}));
  const mx=Math.max(...rows.map(r=>r.n),0), tot=rows.reduce((a,r)=>a+r.n,0);
  const items=rows.map(r=>({label:r.l.NombreLote,value:r.n,color:r.n===mx&&mx>0?'#E3182F':'#CBD5E1',tip:r.l.NombreLote+'\n'+fInt(r.n)+' hogares'}));
  return `
  <section class="card hasdl fade">${dlBtn('lotes','Hogares por lote',['Lote','Hogares'],rows.map(r=>[r.l.NombreLote,r.n]))}<h3>Hogares por lote</h3><div class="sub">El lote con más hogares se resalta en rojo</div>${items.length?bars(items):'<div class="empty">Sin datos</div>'}</section>
  <section class="card hasdl mt fade">${dlBtn('lotecont','Hogares por lote y contratista',['Lote','N.º contrato','Contratista','Total hogares'],rows.slice().sort((a,b)=>b.n-a.n).map(r=>[r.l.NombreLote,r.l.NumContrato,r.l.Contratista,r.n]))}<h3>Hogares por lote y contratista</h3><div class="sub">Contrato asociado a cada lote y contratista a cargo</div>
    <div class="tbl-wrap"><table><thead><tr><th>Lote</th><th>N.º contrato</th><th>Contratista</th><th class="nr">Total hogares</th></tr></thead><tbody>
    ${rows.slice().sort((a,b)=>b.n-a.n).map(r=>`<tr><td>${esc(r.l.NombreLote)}</td><td>${esc(r.l.NumContrato)}</td><td>${esc(r.l.Contratista)}</td><td class="nr">${fInt(r.n)}</td></tr>`).join('')}
    </tbody><tfoot><tr><td colspan="3">Total</td><td class="nr">${fInt(tot)}</td></tr></tfoot></table></div></section>`;
}

const COLS=[['CHIP','CHIP'],['Barrio','Barrio'],['Lote','Lote'],['NumContrato','N.º contrato'],['Contratista','Contratista'],['Estado','Estado actual'],
  ['Terminado','Terminado'],['v','Valor vivienda',1],['ve','Valor ejecutado',1],['avance','% avance',1],['ini','Inicio obra'],['fin','Fin obra'],['HogarID','ID hogar']];
function rowsDatos(c){
  let r=c.hog.map(h=>{ const l=D.loteById.get(h.LoteID)||{}; return {CHIP:h.CHIP,Barrio:h.Barrio,Lote:l.NombreLote||'',NumContrato:l.NumContrato||'',Contratista:l.Contratista||'',
    Estado:h.Estado,Terminado:h.Terminado?'Sí':'No',v:h.v,ve:h.ve,avance:h.v?h.ve/h.v:0,ini:h.ini,fin:h.fin,HogarID:h.HogarID}; });
  const q=S.q.trim().toLowerCase();
  if(q) r=r.filter(x=>[x.CHIP,x.Barrio,x.Lote,x.NumContrato,x.Contratista,x.Estado].some(s=>String(s).toLowerCase().includes(q)));
  r.sort((a,b)=>{ const x=a[S.sk],y=b[S.sk]; return (x>y?1:x<y?-1:0)*S.sd; });
  return r;
}
const PS=25;
function pageDatos(c){
  const r=rowsDatos(c), pages=Math.max(1,Math.ceil(r.length/PS)); S.pg=Math.min(S.pg,pages-1);
  const cell=(k,x)=>{ const v=x[k]; if(k==='v'||k==='ve') return `<td class="nr">${fMoney(v)}</td>`; if(k==='avance') return `<td class="nr">${fPct(v)}</td>`;
    if(k==='ini'||k==='fin') return `<td>${fDate(v)}</td>`; if(k==='Estado') return `<td><span class="chip"><i style="background:${stateColor(v)}"></i>${esc(v)}</span></td>`; return `<td>${esc(v)}</td>`; };
  return `<section class="card fade"><h3>Datos completos</h3><div class="sub">Todos los hogares con sus datos principales. Busca, ordena haciendo clic en los encabezados y descarga el resultado en CSV (se abre en Excel).</div>
    <div class="toolbar"><label class="search" aria-label="Buscar">🔎<input id="q" type="search" placeholder="Buscar por CHIP, barrio, lote, contratista o estado" value="${esc(S.q)}"></label>
    <span style="color:var(--slate)">${fInt(r.length)} hogares</span><button class="btn" id="csv">Descargar CSV</button></div>
    <div class="tbl-wrap"><table><thead><tr>${COLS.map(c2=>`<th data-k="${c2[0]}" class="${c2[2]?'nr':''}">${c2[1]}<span class="ar">${S.sk===c2[0]?(S.sd>0?'▲':'▼'):''}</span></th>`).join('')}</tr></thead>
    <tbody>${r.slice(S.pg*PS,S.pg*PS+PS).map(x=>`<tr>${COLS.map(c2=>cell(c2[0],x)).join('')}</tr>`).join('')||`<tr><td colspan="${COLS.length}" class="empty">Sin resultados</td></tr>`}</tbody></table></div>
    <div class="pager"><button class="btn ghost" id="pv" ${S.pg===0?'disabled':''}>‹ Anterior</button><span>Página ${S.pg+1} de ${pages}</span><button class="btn ghost" id="nx" ${S.pg>=pages-1?'disabled':''}>Siguiente ›</button></div></section>`;
}
function bindDatos(c){
  const q=$('#q'); if(q){ q.addEventListener('input',()=>{ S.q=q.value; S.pg=0; const p=q.selectionStart; render(true); const n=$('#q'); n.focus(); n.setSelectionRange(p,p); }); }
  document.querySelectorAll('th[data-k]').forEach(th=>th.addEventListener('click',()=>{ const k=th.dataset.k; if(S.sk===k) S.sd*=-1; else {S.sk=k;S.sd=1;} render(true); }));
  $('#pv')?.addEventListener('click',()=>{S.pg--;render(true)}); $('#nx')?.addEventListener('click',()=>{S.pg++;render(true)});
  $('#csv')?.addEventListener('click',()=>{
    const r=rowsDatos(c), head=COLS.map(x=>x[1]);
    const q2=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
    const lines=[head.map(q2).join(';')].concat(r.map(x=>COLS.map(k=>{ const v=x[k[0]]; return q2(k[0]==='ini'||k[0]==='fin'?fDate(v):k[0]==='avance'?(v*100).toFixed(1).replace('.',',')+'%':v); }).join(';')));
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}));
    a.download='CVProgreso_hogares_'+new Date().toISOString().slice(0,10)+'.csv'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1500);
  });
}

/* =====================================================================
   RENDER
   ===================================================================== */
function drawChrome(sample){
  const pg=PAGES.find(p=>p.id===S.page);
  $('#tabs').innerHTML=PAGES.map(p=>`<button class="tab ${p.sec?'sec':''}" role="tab" aria-selected="${p.id===S.page}" data-p="${p.id}">${p.t}</button>`).join('');
  document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{ S.page=b.dataset.p; S.pg=0; render(); scrollTo({top:0}); }));
  const years=[...new Set(D.months.map(m=>m.y))], quarters=[...new Set(D.months.map(m=>m.q))];
  const sel=(id,label,opts,val)=>`<div class="fil"><label for="${id}">${label}</label><select id="${id}"><option value="">Todas</option>${opts.map(o=>`<option value="${esc(o[0])}" ${String(val)===String(o[0])?'selected':''}>${esc(o[1])}</option>`).join('')}</select></div>`;
  $('#filters').innerHTML=(pg.f.includes('lote')?sel('fLote','Lote de obra',D.lotes.map(l=>[l.LoteID,l.NombreLote]),S.lote):'')+
    (pg.f.includes('anio')?sel('fAnio','Año',years.map(y=>[y,y]),S.anio):'')+(pg.f.includes('trim')?sel('fTrim','Trimestre',quarters.map(q=>[q,q]),S.trim):'');
  [['fLote','lote'],['fAnio','anio'],['fTrim','trim']].forEach(([id,k])=>{ const e=$('#'+id); if(e) e.addEventListener('change',()=>{ S[k]=e.value; S.pg=0; render(true); }); });
  $('#upd').textContent='Última actualización: '+fStamp(D.upd);
  $('#pdf').style.display=S.page==='datos'?'none':'';
}
let SAMPLE=false;
function render(keepScroll){
  const y=scrollY; charts.length=0; Object.keys(DL).forEach(k=>delete DL[k]); hideTip();
  const c=ctx(); drawChrome();
  const banner=SAMPLE?`<div class="banner"><span>⚠</span><div><b>Vista con datos de ejemplo.</b> Estas cifras NO son reales: el tablero aún no está conectado a la base de datos (ver <i>README_conexion.md</i>).</div></div>`:'';
  const html={portada:pagePortada,general:pageGeneral,presupuesto:pagePresupuesto,detalle:pageDetalle,datos:pageDatos}[S.page](c);
  $('#view').innerHTML=printHead(PAGES.find(p=>p.id===S.page))+banner+html;
  if(S.page==='datos') bindDatos(c);
  charts.forEach(f=>f());
  if(keepScroll) scrollTo({top:y});
}
/* Descargar PDF: imprime la página actual con los filtros aplicados (el usuario elige «Guardar como PDF») */
const TITLE0=document.title;
function loteSel(){ return S.lote?((D.loteById.get(+S.lote)||{}).NombreLote||''):''; }
function printHead(pg){
  const p=['<b>'+esc(pg.t)+'</b>'];
  if(pg.f.includes('lote')) p.push('Lote: '+esc(loteSel()||'Todos'));
  if(pg.f.includes('anio')) p.push('Año: '+esc(S.anio||'Todos'));
  if(pg.f.includes('trim')) p.push('Trimestre: '+esc(S.trim||'Todos'));
  p.push('Datos al '+fStamp(D.upd));
  return '<div class="printhead">'+p.join(' &nbsp;·&nbsp; ')+'</div>';
}
function printPage(){
  const pg=PAGES.find(p=>p.id===S.page), l=loteSel();
  document.title='CVProgreso - '+pg.t+(l?' - '+l:'')+' - '+new Date().toISOString().slice(0,10);
  window.print();
}
addEventListener('afterprint',()=>{ document.title=TITLE0; });
$('#pdf').addEventListener('click',printPage);
let rt; addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(()=>charts.forEach(f=>f()),150); });

/* Arranque */
loadData().then(({raw,sample})=>{ SAMPLE=sample; D=prep(raw); render(); })
 .catch(err=>{ $('#view').innerHTML='<div class="card"><h3>No se pudieron cargar los datos</h3><p class="sub">'+esc(err.message)+'</p></div>'; console.error(err); });
})();
</script>
</body>
</html>

# Servidor estatico del Tablero CVProgreso (solo para prueba en local).
# Tablero_CVP.html  -> /usr/share/nginx/html   (archivo montado desde esta carpeta)
# data.js           -> /usr/share/nginx/web    (volumen "web", lo escribe el actualizador)
#
# OJO: no hay autenticacion. Quien llegue al puerto ve data.js completo.
server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index Tablero_CVP.html;
    autoindex off;

    # Solo lectura: nada de POST, PUT, DELETE...
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Los datos cambian cada corrida: que el navegador no los guarde.
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = / {
        try_files /Tablero_CVP.html =404;
    }

    location = /Tablero_CVP.html {
        try_files $uri =404;
    }

    # Si el actualizador aun no termina su primera corrida, data.js no existe (404)
    # y el tablero muestra los datos de ejemplo.
    location = /data.js {
        alias /usr/share/nginx/web/data.js;
        default_type application/javascript;
    }

    # El HTML pide config.js (propiedades opcionales del navegador). Aqui se responde vacio
    # para evitar el 404 en la consola; el tablero usa entonces data.js.
    location = /config.js {
        default_type application/javascript;
        return 200 "window.CVP_CONFIG = {allowSample: false};\n";
    }

    # El navegador pide el icono de la pestana; se responde "sin contenido" para no llenar la consola de 404.
    location = /favicon.ico {
        access_log off;
        return 204;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Cualquier otra ruta: no existe.
    location / {
        return 404;
    }
}

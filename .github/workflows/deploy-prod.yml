name: Desplegar tablero CVP en producción

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Escribe DESPLEGAR-PRODUCCION para confirmar el despliegue en producción'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-cvp-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Desplegar en cvp-prod
    # Producción: SOLO manual (nunca por push) y con confirmación escrita. El plan de la organización (Team) no permite revisores
    # obligatorios en environments de repos privados; el environment cvp-prod se limita a la rama cvp y esta confirmación evita ejecuciones accidentales.
    if: ${{ github.ref == 'refs/heads/cvp' && inputs.confirmar == 'DESPLEGAR-PRODUCCION' }}
    runs-on: [self-hosted, linux, x64, deploy]
    timeout-minutes: 10
    environment: cvp-prod

    env:
      # Host, usuario y known_hosts son variables del environment (no son secretos). Solo la llave privada es un secreto.
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_SCRIPT: ${{ vars.DEPLOY_SCRIPT || '/usr/local/sbin/deploy-tableros-bi' }}
      DEPLOY_KEY_FINGERPRINT: ${{ vars.DEPLOY_KEY_FINGERPRINT }}

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Validar y empaquetar
        shell: bash
        run: |
          set -euo pipefail
          test -s Tablero_CVP.html || { echo "Falta Tablero_CVP.html" >&2; exit 1; }
          grep -q "<html" Tablero_CVP.html || { echo "Tablero_CVP.html no parece un HTML" >&2; exit 1; }

          # En producción nginx sirve el HTML desde disco con la sesión del aplicativo: no hay contexto de Tomcat, así que no se envía web.xml.
          STAGE="$RUNNER_TEMP/stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp Tablero_CVP.html "$STAGE/Tablero_CVP.html"
          tar -C "$STAGE" -czf "$RUNNER_TEMP/tableros-bi-cvp.tar.gz" Tablero_CVP.html
          echo "Paquete: $(tar -tzf "$RUNNER_TEMP/tableros-bi-cvp.tar.gz" | tr '\n' ' ')"

      - name: Desplegar por SSH
        shell: bash
        run: |
          set -euo pipefail

          : "${DEPLOY_HOST:?Falta DEPLOY_HOST (variable del environment cvp-prod)}"
          : "${DEPLOY_USER:?Falta DEPLOY_USER (variable del environment)}"
          : "${DEPLOY_SSH_PRIVATE_KEY:?Falta el secreto DEPLOY_SSH_PRIVATE_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?Falta DEPLOY_KNOWN_HOSTS (variable del environment)}"
          : "${DEPLOY_SCRIPT:?Falta la variable DEPLOY_SCRIPT}"

          if [[ ! "$DEPLOY_PORT" =~ ^[0-9]+$ ]]; then
            echo "DEPLOY_PORT debe ser numérico" >&2
            exit 1
          fi
          if [[ ! "$DEPLOY_SCRIPT" =~ ^/[A-Za-z0-9._/-]+$ ]]; then
            echo "DEPLOY_SCRIPT debe ser una ruta absoluta válida" >&2
            exit 1
          fi

          SSH_KEY="$RUNNER_TEMP/deploy_key"
          SSH_PUBLIC_KEY="$RUNNER_TEMP/deploy_key.pub"
          KNOWN_HOSTS="$RUNNER_TEMP/known_hosts"
          REMOTE_PAQUETE="/tmp/tableros-bi-cvp-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"

          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$SSH_KEY"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$KNOWN_HOSTS"
          chmod 600 "$SSH_KEY" "$KNOWN_HOSTS"
          trap 'rm -f "$SSH_KEY" "$SSH_PUBLIC_KEY" "$KNOWN_HOSTS"' EXIT

          if ! ssh-keygen -y -f "$SSH_KEY" > "$SSH_PUBLIC_KEY"; then
            echo "DEPLOY_SSH_PRIVATE_KEY no contiene una llave privada válida" >&2
            exit 1
          fi
          if [[ -n "${DEPLOY_KEY_FINGERPRINT:-}" ]]; then
            ACTUAL="$(ssh-keygen -lf "$SSH_PUBLIC_KEY" | awk '{print $2}')"
            if [[ "$ACTUAL" != "$DEPLOY_KEY_FINGERPRINT" ]]; then
              echo "La llave no corresponde a la huella esperada ($ACTUAL)" >&2
              exit 1
            fi
          fi

          SSH_OPTIONS=(
            -i "$SSH_KEY"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$KNOWN_HOSTS"
          )

          scp -P "$DEPLOY_PORT" "${SSH_OPTIONS[@]}" "$RUNNER_TEMP/tableros-bi-cvp.tar.gz" "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_PAQUETE"

          printf -v REMOTE_COMMAND 'sudo -n %q %q' "$DEPLOY_SCRIPT" "$REMOTE_PAQUETE"
          ssh -p "$DEPLOY_PORT" "${SSH_OPTIONS[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "$REMOTE_COMMAND"

      - name: Registrar resultado
        shell: bash
        run: |
          {
            echo "### Tablero CVP desplegado en producción"
            echo "- Ambiente: cvp-prod"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- URL: /tablero-cvp/Tablero_CVP.html"
          } >> "$GITHUB_STEP_SUMMARY"
